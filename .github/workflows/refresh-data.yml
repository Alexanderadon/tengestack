name: Refresh dataset

# Ежедневная выгрузка hh.kz → свежий снапшот → коммит. Прод подтягивает данные
# через rewrite с raw.githubusercontent (репо tengestack) — без редеплоя.
# Скрейпинг публичных страниц идёт с IP GitHub-раннера (проверено — hh.kz пускает).
on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = 00:00 Алматы (UTC+5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Scrape vacancies from hh.kz
        run: pnpm data:scrape

      # build берёт только последний снапшот (окно свежести) — без накопления мёртвых вакансий
      - name: Build dataset
        run: pnpm data:build

      # держим лёгкий архив: только 3 последних сырых снапшота в репо
      - name: Prune old raw snapshots (keep last 3)
        run: ls -1 data/raw/*.jsonl 2>/dev/null | sort | head -n -3 | xargs -r rm -f || true

      - name: Commit snapshot
        run: |
          git config user.name "tengestack-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/raw public/data
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "data: daily snapshot $(date -u +%F)"
          git push
